# Applies ovr/supabase/migrations to the hosted Supabase project.
# Run it from GitHub → Actions → "OVR: push database" → Run workflow.
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
name: "OVR: push database"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ovr
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PW: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets are set
        run: |
          for v in SUPABASE_ACCESS_TOKEN REF PW; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
      - name: Show what will be applied
        run: npx --yes supabase@3.0.0 db push --remote="$REF" --password "$PW" --dry-run --yes
      - name: Apply migrations
        run: npx --yes supabase@3.0.0 db push --remote="$REF" --password "$PW" --yes
